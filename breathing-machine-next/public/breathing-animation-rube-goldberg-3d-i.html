<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini-Golf Breathing — 3D</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: #f3e6cf; font-family: -apple-system, "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
  #stage { position: fixed; inset: 0; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; color: #2b2620; }
  #title { position: absolute; top: 14px; left: 16px; background: rgba(255,255,255,.72); border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(4px); display: flex; align-items: center; gap: 10px; pointer-events: auto; }
  #title button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid rgba(0,0,0,.12); background: rgba(255,255,255,.8); font-size: 15px; cursor: pointer; }
  #title button:focus-visible { outline: 3px solid #2050e0; outline-offset: 2px; }
  #title button.on { box-shadow: inset 0 0 0 2px #2050e0; }
  #title .st { font-size: 12px; letter-spacing: .08em; opacity: .75; font-weight: 600; }
  #phase { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); text-align: center; background: rgba(255,255,255,.72); border-radius: 12px; padding: 6px 22px 8px; backdrop-filter: blur(4px); }
  #phase .lbl { font-size: 26px; font-weight: 800; letter-spacing: .22em; margin-right: -.22em; }
  #phase .cnt { font-size: 15px; font-weight: 700; letter-spacing: .3em; margin-right: -.3em; opacity: .7; margin-top: 2px; }
  #btns { position: absolute; top: 14px; right: 16px; display: flex; gap: 8px; pointer-events: auto; }
  #btns button { width: 44px; height: 44px; border-radius: 10px; border: 1px solid rgba(0,0,0,.12); background: rgba(255,255,255,.8); font-size: 17px; cursor: pointer; backdrop-filter: blur(4px); }
  #btns button:focus-visible { outline: 3px solid #2050e0; outline-offset: 2px; }
  #btns button.on { box-shadow: inset 0 0 0 2px #2050e0; }
  #phase { will-change: transform; }
  #cap { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 12px; letter-spacing: .18em; font-weight: 700; background: rgba(255,255,255,.6); padding: 6px 14px; border-radius: 8px; backdrop-filter: blur(4px); white-space: nowrap; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .18s linear; z-index: 9; }
  #ui.darktext { color: #e8e4da; }
  #ui.darktext #title, #ui.darktext #cap { background: rgba(10,12,18,.55); }
  #ui.darktext #title button { background: rgba(20,24,34,.7); color: #e8e4da; border-color: rgba(255,255,255,.16); }
  #ui.darktext #phase { background: rgba(52,62,84,.88); border: 1px solid rgba(178,198,232,.38); }
  #ui.lightsout #phase { background: rgba(48,33,14,.88); border: 1px solid rgba(255,176,32,.42); }
  #ui.darktext #btns button { background: rgba(20,24,34,.7); color: #e8e4da; border-color: rgba(255,255,255,.16); }
  @media (max-width: 600px) {
    #phase .lbl { font-size: 20px; }
    #title .st { font-size: 10px; }
    #title { left: 8px; top: 8px; padding: 6px 9px; max-width: 44vw; }
    #title button { width: 30px; height: 30px; font-size: 13px; }
    #btns { right: 8px; top: 8px; }
    #btns button { width: 38px; height: 38px; font-size: 15px; }
    #phase { top: 62px; padding: 4px 16px 6px; }
    #cap { bottom: 10px; font-size: 10px; }
  }
</style>

import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const STATION_T = 10.5, INHALE_T = 3.5, LOOP_T = 157.5, NST = 15;

const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const sstep=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);

/* ================= RENDERER / SCENE ================= */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, (innerWidth<700?1.5:2)));

renderer.shadowMap.enabled = true;

renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
if ('environmentIntensity' in scene) scene.environmentIntensity = 0.5;

const camera = new THREE.OrthographicCamera(-1,1,1,-1, 0.1, 600);
const ISO_DIR = V3(1,1,1).normalize(); // azimuth 45°, elevation ~35.26°
const FRUSTUM_H = 13;
/* whole-canvas view: framing for the entire 3-row serpentine, computed by
   projecting the world bounding box into camera space (robust across aspects) */
let wholeView=false;
const wholeLook=new THREE.Vector3(), wholePos=new THREE.Vector3();
let wholeH=50;
const WORLD_BOX=new THREE.Box3(V3(-52,-2,-38), V3(58,20,34));
const _wc=new THREE.Vector3();
function computeWhole(){
  const ctr=WORLD_BOX.getCenter(_wc);
  camera.position.copy(ctr).addScaledVector(ISO_DIR,140);
  camera.lookAt(ctr); camera.updateMatrixWorld();
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  const c=new THREE.Vector3();
  for(let i=0;i<8;i++){
    c.set(i&1?WORLD_BOX.max.x:WORLD_BOX.min.x, i&2?WORLD_BOX.max.y:WORLD_BOX.min.y, i&4?WORLD_BOX.max.z:WORLD_BOX.min.z);
    c.applyMatrix4(camera.matrixWorldInverse);
    if(c.x<minX)minX=c.x; if(c.x>maxX)maxX=c.x;
    if(c.y<minY)minY=c.y; if(c.y>maxY)maxY=c.y;
  }
  const a=innerWidth/innerHeight;
  wholeH=Math.max((maxY-minY)/2, ((maxX-minX)/2)/a)*1.07;
  wholeLook.set((minX+maxX)/2,(minY+maxY)/2,0).applyMatrix4(camera.matrixWorld);
  wholePos.copy(wholeLook).addScaledVector(ISO_DIR,140);
}
function updateFrustum(){
  const a=innerWidth/innerHeight;
  if(wholeView) computeWhole();
  const H=wholeView?wholeH:FRUSTUM_H*(a<1?Math.min(2.2,1.3/a):1);
  camera.left=-H*a; camera.right=H*a; camera.top=H; camera.bottom=-H;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
updateFrustum(); addEventListener('resize', updateFrustum);

/* Phase-tied breathing velocity: ball speed is a direct function of breath phase.
   Each phase is its own complete wave — ease in at the phase start, speed up
   through the middle, slow down at the phase end — for both inhale and exhale.
   Raised-cosine bumps with zero slope at both ends of each phase, so the beat
   (a velocity trough — the mechanisms do the dramatic work there, not the ball)
   and the station boundaries are C1-continuous: the breath turns over with no
   edges anywhere. Strictly > 0 always.
   Each phase's bump has mean 0.5, so phase integrals are unchanged: the beat
   lands at exactly 1/3 of each station's arc and overall pacing is preserved.
   V0/VPEAK are the feel knobs: widen the gap for more breath contrast,
   narrow it for subtlety. */

  if(tau<INHALE_T){ const u=tau/INHALE_T; return (1-Math.cos(2*Math.PI*u))/2; }

function refreshFavicon(){
  try{
    var d=THEME_DEFS[themeIdx], S=96;
    var cv=document.createElement('canvas'); cv.width=cv.height=S;
    var g=cv.getContext('2d');
    var css=function(h){return '#'+('00000'+h.toString(16)).slice(-6);};
    var mix=function(h1,h2,t){
      var r=Math.round(((h1>>16)&255)+((((h2>>16)&255)-((h1>>16)&255))*t));
      var gg=Math.round(((h1>>8)&255)+((((h2>>8)&255)-((h1>>8)&255))*t));
      var b=Math.round((h1&255)+(((h2&255)-(h1&255))*t));
      return '#'+('00000'+((r<<16)|(gg<<8)|b).toString(16)).slice(-6);
    };
    g.fillStyle=css(d.sky); g.fillRect(0,0,S,S);
    var cx=S/2, cy=S*0.52, r=S*0.30, glow;
    if(themeIdx===2){ /* lights-out: amber ball, hot glow */
      glow=g.createRadialGradient(cx,cy,r*0.6,cx,cy,r*2.1);
      glow.addColorStop(0,css(d.ballE)); glow.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=glow; g.fillRect(0,0,S,S);
    }else if(themeIdx===1){ /* dark: faint blue aura */

      g.fillStyle=glow; g.fillRect(0,0,S,S);
    }
    var grad=g.createRadialGradient(cx-r*0.38,cy-r*0.42,r*0.08,cx,cy,r*1.05);
    grad.addColorStop(0,mix(d.ball,0xffffff,0.75));
    grad.addColorStop(0.45,mix(d.ball,0xffffff,0.12));
    grad.addColorStop(1,mix(d.ball,0x000000,0.45));
    g.fillStyle=grad;
    g.beginPath(); g.arc(cx,cy,r,0,6.2832); g.fill();
    g.fillStyle='rgba(255,255,255,0.85)';
    g.beginPath(); g.arc(cx-r*0.36,cy-r*0.44,r*0.10,0,6.2832); g.fill();
    var topDoc=document;
    try{ if(window.top&&window.top.document) topDoc=window.top.document; }catch(e){}

}

  document.body.style.background='#'+TC.sky.getHexString();

  masterCurve.getTangentAt(arc/LTOT,ballTan);
  ctx.offset.set(0,0,0);
  if(si===4){ const bx=ctx.ballPos.x; // ride the lowering drawbridge deck
    if(bx>40.8&&bx<48.7) ctx.offset.y+=(bx-41)*(Math.tan(S5.ang)-TAN20); }

    else if(filmTime<WRAP_POST) wrapK=1-filmTime/WRAP_POST;

  const k=RM?1:1-Math.exp(-dt*4.2);
  camPos.lerp(camPosT,k); camLook.lerp(camLookT,k);
  camera.position.copy(camPos); camera.lookAt(camLook);
  sun.position.set(camLook.x-18,camLook.y+30,camLook.z+12);
  sun.target.position.copy(camLook);
  // UI
  const remain=phase==='in'?INHALE_T-tau:STATION_T-tau;
  ui.pl.textContent=phase==='in'?'INHALE':'EXHALE';
  const n=Math.max(1,Math.ceil(remain-1e-4));
  if(ui.pc.textContent!==''+n) ui.pc.textContent=n;
  // the phase label box breathes in sync with the per-phase progress: expands
  // through inhale, contracts through exhale — fluid, eased, never popping
  if(!RM){ const bs=0.92+0.18*breathVol(tau);
    ui.ph.style.transform='translateX(-50%) scale('+bs.toFixed(4)+')'; }
  // particles (cosmetic only)
  updateBursts(fdt); updateTrail(fdt); updateMotes();
  moteMat.opacity=themeIdx===0?0.20:0.32;
  // whole-view ball marker
  markRing.visible=wholeView;
  if(wholeView){ markRing.position.set(ball.position.x,ball.position.y-0.55,ball.position.z);
    markRing.material.opacity=0.38+0.14*Math.sin(filmTime*3.5); }
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
